name: Rebrand IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "New app name (name)"
        required: true
        default: "keep"
      menu_title:
        description: "Mod menu title"
        required: true
        default: "Ashte Mobile 📱"
      from_tag:
        description: "Release to download IPAs from"
        required: true
        default: "V.1"
      to_tag:
        description: "Release to upload new IPAs to"
        required: true
        default: "V.5"
      menu_color_hex:
        description: "New menu1E64E8)"
        required: true
        default: "8B5CF6"
      menu_modern:
        description: "(true/false)"
        required: true
        default: "true"
      ipa_link:
        description: "Optional= all IPAs)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pillow & LIEF
        run: pip3 install --break-system-packages --quiet pillow lief

      - name: Run script
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FROM_TAG: ${{ inputs.from_tag }}
          TO_TAG: ${{ inputs.to_tag }}
          NEW_NAME: ${{ inputs.app_name }}
          NEW_LOGO: logo.png
          MENU_ICON: menu_icon.png
          MENU_TITLE: ${{ inputs.menu_title }}
          MENU_COLOR_HEX: ${{ inputs.menu_color_hex }}
          MENU_MODERN: ${{ inputs.menu_modern }}
          IPA_LINK: ${{ inputs.ipa_link }}
        run: |
          chmod +x ipa-rebrand.sh
          ./ipa-rebrand.sh
