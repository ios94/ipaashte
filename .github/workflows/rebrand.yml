name: Rebrand IPA

on:
  workflow_dispatch:
    inputs:
      menu_title:
        description: "Mod menu title"
        required: true
        default: "Ashte Mod"
      from_tag:
        description: "Release to download IPAs from"
        required: true
        default: "V.1"
      to_tag:
        description: "Release to upload new IPAs to"
        required: true
        default: "V.5"
      menu_color_hex:
        description: "New menu color in HEX (Blue default: 1E64E8)"
        required: true
        default: "1E64E8"
      menu_modern:
        description: "Modern rounded menu look (true/false)"
        required: true
        default: "true"
      ipa_link:
        description: "Optional: ANY direct link of ONE IPA (GitHub, Dropbox, Google Drive, any site). Empty = all IPAs from from_tag"
        required: false
        default: ""
      page_link:
        description: "Optional: app page link (icon + screenshots source, or an App Store link). Used only together with ipa_link"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pillow & LIEF
        run: pip3 install --break-system-packages --quiet pillow lief

      - name: Run script
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          FROM_TAG: ${{ inputs.from_tag }}
          TO_TAG: ${{ inputs.to_tag }}
          NEW_LOGO: logo.png
          MENU_ICON: menu_icon.png
          MENU_TITLE: ${{ inputs.menu_title }}
          MENU_COLOR_HEX: ${{ inputs.menu_color_hex }}
          MENU_MODERN: ${{ inputs.menu_modern }}
          IPA_LINK: ${{ inputs.ipa_link }}
          PAGE_LINK: ${{ inputs.page_link }}
        run: |
          chmod +x ipa-rebrand.sh
          ./ipa-rebrand.sh

      - name: Commit ashte.json, img and imgg
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ashte.json img imgg
          if git diff --cached --quiet; then
            echo "No changes in ashte.json / images"
          else
            git commit -m "Update ashte.json"
            git pull --rebase
            git push
          fi
