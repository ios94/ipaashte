name: Rebrand IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "New app name"
        required: true
        default: "My App"
      menu_title:
        description: "Mod menu title (max 20 characters)"
        required: true
        default: "Ashte Mod"
      from_tag:
        description: "Release to download IPAs from"
        required: true
        default: "V.1"
      to_tag:
        description: "Release to upload new IPAs to"
        required: true
        default: "V.5"
      menu_color_hex:
        description: "New menu color in HEX (Blue default: 1E64E8)"
        required: true
        default: "1E64E8"

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python, Pillow & ldid
        run: |
          pip3 install --quiet pillow
          sudo curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Run script
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FROM_TAG: ${{ inputs.from_tag }}
          TO_TAG: ${{ inputs.to_tag }}
          NEW_NAME: ${{ inputs.app_name }}
          NEW_LOGO: logo.png
          MENU_ICON: menu_icon.png
          MENU_TITLE: ${{ inputs.menu_title }}
          MENU_COLOR_HEX: ${{ inputs.menu_color_hex }}
        run: |
          chmod +x ipa-rebrand.sh
          ./ipa-rebrand.sh

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dylibs
          path: work/debug
          if-no-files-found: ignore
